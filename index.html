<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - 網頁版單字本與學習助手</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    @keyframes toast-in {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-toast { animation: toast-in 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Top Navigation Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('dash')">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/30">V</div>
        <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">VocabMaster</span>
      </div>

      <nav class="flex items-center gap-2">
        <button onclick="switchView('dash')" id="nav-dash" class="px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 text-indigo-400 bg-slate-700/50">
          <i class="fa-solid fa-book-bookmark mr-1.5"></i>單字庫
        </button>
        <button onclick="switchView('srs')" id="nav-srs" class="px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 text-slate-300 relative">
          <i class="fa-solid fa-brain mr-1.5"></i>艾賓豪斯複習
          <span id="srs-count-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <button onclick="switchView('extract')" id="nav-extract" class="px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 text-slate-300">
          <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>智慧提取
        </button>
        <button onclick="openModal('settings-modal')" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition" title="設定">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

    <!-- Hero Action Section: Direct Batch Input -->
    <div class="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 border border-indigo-500/30 rounded-2xl p-5 shadow-xl space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-indigo-300 font-bold text-sm">
          <i class="fa-solid fa-circle-plus text-indigo-400"></i> 極速單字新增與批量解析
        </div>
        <div class="text-xs text-slate-400">支援單字或多行批量輸入，AI 自動補齊釋義與例句</div>
      </div>
      
      <div class="flex flex-col md:flex-row gap-2">
        <textarea id="batch-input-terms" rows="2" placeholder="直接輸入單字，支援批量輸入（例如：resilience, serendipity 或每行一個單字）..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 font-sans"></textarea>
        <button onclick="processBatchInput()" id="btn-batch-add" class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm rounded-xl shadow-lg transition flex items-center justify-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵 AI 智慧解析與加入
        </button>
      </div>
    </div>

    <!-- Gist Sync Status Banner -->
    <div class="bg-slate-800 border border-slate-700/80 px-5 py-3 rounded-xl flex items-center justify-between text-xs">
      <div id="gist-status-text" class="font-medium text-slate-300 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span> 未連接 Gist
      </div>
      <div class="flex gap-2">
        <button onclick="syncFromGist()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 font-semibold rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-cloud-arrow-down"></i> 下載同步
        </button>
        <button onclick="syncToGist()" class="px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 font-semibold rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-cloud-arrow-up"></i> 上傳備份
        </button>
      </div>
    </div>

    <!-- VIEW 1: Dashboard / Decks -->
    <section id="view-dash" class="space-y-6">
      <!-- Deck Selection Header -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-800/40 p-4 rounded-xl border border-slate-700/50">
        <div class="flex items-center gap-3 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0" id="deck-tab-container"></div>
        <button onclick="openModal('create-deck-modal')" class="whitespace-nowrap px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-folder-plus"></i> 新增單字本
        </button>
      </div>

      <!-- Word Cards Grid -->
      <div id="word-card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- VIEW 2: SRS Ebbinghaus Flashcards -->
    <section id="view-srs" class="hidden space-y-6">
      <div class="max-w-xl mx-auto text-center space-y-4">
        <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
          <div class="text-left">
            <div class="text-xs text-slate-400">當前複習單字本</div>
            <div id="srs-deck-title" class="font-bold text-slate-200">全部單字本</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400">待複習數量</div>
            <div id="srs-due-count" class="font-black text-xl text-indigo-400">0</div>
          </div>
        </div>

        <!-- Flashcard Wrapper -->
        <div id="srs-card-container" class="relative min-h-[320px] w-full perspective-1000 cursor-pointer" onclick="flipSrsCard()">
          <div id="srs-card-inner" class="w-full h-full min-h-[320px] transition-transform duration-500 transform-style-3d bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col justify-between shadow-2xl relative">
            <!-- Front Card -->
            <div class="backface-hidden absolute inset-0 p-6 flex flex-col justify-between items-center text-center bg-slate-800 rounded-2xl">
              <span class="text-xs text-slate-500 font-mono">點擊卡片翻面</span>
              <div class="my-auto">
                <h3 id="srs-front-word" class="text-4xl font-black text-white tracking-wide mb-2">Ready?</h3>
                <p id="srs-front-phonetic" class="text-indigo-400 font-mono text-sm"></p>
              </div>
              <button onclick="event.stopPropagation(); speakText(document.getElementById('srs-front-word').innerText)" class="p-3 rounded-full bg-slate-700/50 hover:bg-slate-700 text-indigo-400 transition">
                <i class="fa-solid fa-volume-high text-lg"></i>
              </button>
            </div>

            <!-- Back Card -->
            <div class="backface-hidden rotate-y-180 absolute inset-0 p-6 flex flex-col justify-between bg-slate-800 rounded-2xl text-left border border-indigo-500/30 overflow-y-auto">
              <div>
                <div class="flex justify-between items-start mb-2">
                  <span id="srs-back-pos" class="px-2 py-0.5 rounded text-xs font-bold bg-indigo-900/60 text-indigo-300">n.</span>
                  <button onclick="event.stopPropagation(); speakText(document.getElementById('srs-front-word').innerText)" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-volume-high"></i>
                  </button>
                </div>
                <h4 id="srs-back-meaning" class="text-xl font-bold text-slate-100 mb-3">釋義載入中</h4>
                <div class="space-y-2 text-sm text-slate-300">
                  <p><strong class="text-slate-400 font-semibold">同義詞：</strong> <span id="srs-back-synonyms"></span></p>
                  <p><strong class="text-slate-400 font-semibold">例句：</strong></p>
                  <blockquote id="srs-back-example" class="italic border-l-2 border-indigo-500 pl-3 text-slate-400 bg-slate-900/40 py-1 rounded-r"></blockquote>
                </div>
              </div>
              <div class="text-xs text-slate-500 text-center mt-4">選擇下方評分以更新艾賓豪斯記憶週期</div>
            </div>
          </div>
        </div>

        <!-- Rating Buttons -->
        <div id="srs-controls" class="grid grid-cols-3 gap-3 pt-2">
          <button onclick="rateSrsWord(1)" class="py-3 bg-rose-900/40 hover:bg-rose-800/60 border border-rose-700/50 text-rose-200 rounded-xl font-semibold text-sm transition">
            重來<br><span class="text-[10px] text-rose-400 font-normal">1 天後</span>
          </button>
          <button onclick="rateSrsWord(2)" class="py-3 bg-amber-900/40 hover:bg-amber-800/60 border border-amber-700/50 text-amber-200 rounded-xl font-semibold text-sm transition">
            良好<br><span class="text-[10px] text-amber-400 font-normal">加倍週期</span>
          </button>
          <button onclick="rateSrsWord(3)" class="py-3 bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-200 rounded-xl font-semibold text-sm transition">
            簡單<br><span class="text-[10px] text-emerald-400 font-normal">跳級週期</span>
          </button>
        </div>

        <!-- Quick Move to Memory Palace -->
        <button onclick="moveCurrentSrsToPalace()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-amber-400 rounded-lg transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-castle"></i> 已完全掌握？一鍵移至「記憶宮殿」
        </button>
      </div>
    </section>

    <!-- VIEW 3: Smart Text Extraction -->
    <section id="view-extract" class="hidden max-w-3xl mx-auto space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
        <div>
          <h3 class="text-xl font-bold text-white mb-1">YouTube 逐字稿 / 長文章智慧提取</h3>
          <p class="text-sm text-slate-400">貼上文本後，系統將自動分析並挑選中高級詞彙。超過 2,500 字將自動切分成多個單字本管理。</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">目標單字本名稱前綴</label>
          <input type="text" id="extract-deck-prefix" value="文章提取單字" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">文章或逐字稿內容</label>
          <textarea id="extract-input-text" rows="8" placeholder="請在此貼上英文文章、新聞、演講稿或 YouTube 逐字稿..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-indigo-500 font-sans"></textarea>
        </div>

        <button onclick="processTextExtraction()" id="btn-start-extract" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 開始智慧提取並建立單字本
        </button>
      </div>
    </section>
  </main>

  <!-- MODAL: Create Deck -->
  <div id="create-deck-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-white">新增單字本</h3>
      <input type="text" id="new-deck-name-input" placeholder="單字本名稱 (例: 多益 core)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('create-deck-modal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-xl">取消</button>
        <button onclick="createNewDeck()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-xl">建立</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Settings & Gist -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">系統與雲端設定</h3>
        <button onclick="closeModal('settings-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="space-y-4">
        <!-- Gemini API Key -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-2">
          <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider">Gemini API Key</label>
          <input type="password" id="setting-gemini-key" placeholder="AI Studio 取得的 API Key" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono text-xs">
          <p class="text-[11px] text-slate-400">已自動預先帶入您的金鑰，您也可以在此隨時修改更新。</p>
        </div>

        <!-- GitHub Gist Settings -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
          <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider">GitHub Gist 雲端同步設定</label>
          <div>
            <label class="block text-xs text-slate-400 mb-1">GitHub Personal Access Token (PAT, 需要 gist 權限)</label>
            <input type="password" id="setting-gist-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Gist ID (留空將自動為您建立新 Gist)</label>
            <input type="text" id="setting-gist-id" placeholder="例如: 8f9a2b..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono text-xs">
          </div>
        </div>

        <!-- Local JSON Backup -->
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
          <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider">本機 JSON 檔案備份與還原</label>
          <div class="flex gap-2">
            <button onclick="exportBackupJson()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-xl transition">
              <i class="fa-solid fa-file-export mr-1"></i> 匯出 JSON 備份
            </button>
            <label class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-xl transition text-center cursor-pointer">
              <i class="fa-solid fa-file-import mr-1"></i> 匯入 JSON 備份
              <input type="file" id="import-json-file" accept=".json" class="hidden" onchange="importBackupJson(event)">
            </label>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="saveSettings()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-xl text-white">儲存變更</button>
      </div>
    </div>
  </div>

  <!-- Vanilla JS Application Engine -->
  <script>
    const STORAGE_KEY = 'vocabmaster_db_v3';
    const GIST_FILENAME = 'vocabmaster_database.json';
    const MEMORY_PALACE_DECK = '記憶宮殿';

    let db = {
      settings: { 
        geminiApiKey: 'AIzaSyAb8RN6IeWUp0vJR8ipndebpLo83IBlVzY6sL-V4WsZK', 
        gistToken: '', 
        gistId: '' 
      },
      activeDeck: '全部分類',
      decks: [MEMORY_PALACE_DECK, '預設單字本'],
      words: [
        {
          id: 'w1',
          deck: '預設單字本',
          term: 'resilience',
          pos: 'n.',
          phonetic: '/rɪˈzɪliəns/',
          meaning: '復原力，彈性，逆境適應力',
          synonyms: ['adaptability', 'flexibility', 'toughness'],
          example: 'The team showed remarkable resilience despite the setback.',
          srsStage: 0,
          nextReviewDate: new Date().toISOString()
        }
      ]
    };

    let currentSrsIndex = 0;
    let srsQueue = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadDatabase();
      ensureMemoryPalaceDeck();
      renderDecks();
      renderWordCards();
      updateSrsQueue();
      updateGistStatusUI();
    });

    function loadDatabase() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try { db = JSON.parse(stored); } catch (e) { console.error(e); }
      }
      // Ensure default API key is populated if empty
      if (!db.settings.geminiApiKey) {
        db.settings.geminiApiKey = 'AIzaSyAb8RN6IeWUp0vJR8ipndebpLo83IBlVzY6sL-V4WsZK';
      }
    }

    function saveDatabase() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateSrsQueue();
    }

    function ensureMemoryPalaceDeck() {
      if (!db.decks.includes(MEMORY_PALACE_DECK)) {
        db.decks.unshift(MEMORY_PALACE_DECK);
        saveDatabase();
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 border-emerald-500',
        error: 'bg-rose-600 border-rose-500',
        info: 'bg-indigo-600 border-indigo-500'
      };
      toast.className = `p-3 rounded-xl border text-white text-xs font-semibold shadow-2xl flex items-center justify-between pointer-events-auto animate-toast ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-3 text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>`;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    function switchView(viewName) {
      ['dash', 'srs', 'extract'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        document.getElementById(`nav-${v}`).className = "px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 text-slate-300";
      });
      document.getElementById(`view-${viewName}`).classList.remove('hidden');
      document.getElementById(`nav-${viewName}`).className = "px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 text-indigo-400 bg-slate-700/50";
      if (viewName === 'dash') renderWordCards();
      if (viewName === 'srs') prepareSrsSession();
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      if (id === 'settings-modal') {
        document.getElementById('setting-gemini-key').value = db.settings.geminiApiKey || '';
        document.getElementById('setting-gist-token').value = db.settings.gistToken || '';
        document.getElementById('setting-gist-id').value = db.settings.gistId || '';
      }
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function saveSettings() {
      db.settings.geminiApiKey = document.getElementById('setting-gemini-key').value.trim();
      db.settings.gistToken = document.getElementById('setting-gist-token').value.trim();
      db.settings.gistId = document.getElementById('setting-gist-id').value.trim();
      saveDatabase();
      updateGistStatusUI();
      closeModal('settings-modal');
      showToast('設定已成功儲存', 'success');
    }

    function renderDecks() {
      const container = document.getElementById('deck-tab-container');
      container.innerHTML = '';
      const allTab = document.createElement('button');
      allTab.className = `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${db.activeDeck === '全部分類' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
      allTab.innerText = '全部分類';
      allTab.onclick = () => { db.activeDeck = '全部分類'; renderDecks(); renderWordCards(); };
      container.appendChild(allTab);

      db.decks.forEach(deck => {
        const btn = document.createElement('button');
        const isPalace = deck === MEMORY_PALACE_DECK;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition flex items-center gap-1 ${db.activeDeck === deck ? (isPalace ? 'bg-amber-600 text-white' : 'bg-indigo-600 text-white') : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
        btn.innerHTML = `${isPalace ? '<i class="fa-solid fa-castle"></i>' : ''} ${deck}`;
        btn.onclick = () => { db.activeDeck = deck; renderDecks(); renderWordCards(); };
        container.appendChild(btn);
      });
    }

    function createNewDeck() {
      const input = document.getElementById('new-deck-name-input');
      const name = input.value.trim();
      if (!name) return;
      if (!db.decks.includes(name)) {
        db.decks.push(name);
        db.activeDeck = name;
        saveDatabase();
        renderDecks();
        renderWordCards();
      }
      input.value = '';
      closeModal('create-deck-modal');
      showToast(`已建立單字本「${name}」`, 'success');
    }

    function renderWordCards() {
      const grid = document.getElementById('word-card-grid');
      grid.innerHTML = '';
      const filteredWords = db.words.filter(w => db.activeDeck === '全部分類' || w.deck === db.activeDeck);

      if (filteredWords.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 font-medium">此單字本尚無單字，請在上方向上輸入單字開始學習！</div>`;
        return;
      }

      filteredWords.forEach(w => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/90 border border-slate-700/80 hover:border-indigo-500/50 p-5 rounded-2xl flex flex-col justify-between shadow-lg transition duration-200 group relative";
        const moveOptions = db.decks.map(d => `<option value="${d}" ${d === w.deck ? 'selected' : ''}>${d}</option>`).join('');

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between mb-2">
              <div class="flex items-center gap-2">
                <h3 class="text-xl font-bold text-white tracking-wide">${w.term}</h3>
                <span class="text-xs text-indigo-400 font-mono">${w.phonetic || ''}</span>
              </div>
              <button onclick="speakText('${w.term}')" class="text-slate-400 hover:text-indigo-400 transition p-1"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            <div class="mb-3">
              <span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-950 text-indigo-300 border border-indigo-800/40 mb-1">${w.pos || 'n.'}</span>
              <p class="text-slate-200 font-medium text-sm">${w.meaning}</p>
            </div>
            ${w.example ? `<blockquote class="text-xs italic text-slate-400 border-l-2 border-indigo-500/60 pl-2.5 py-0.5 mb-3">${w.example}</blockquote>` : ''}
          </div>
          <div class="pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs">
            <select onchange="moveWordToDeck('${w.id}', this.value)" class="bg-slate-900 border border-slate-700 text-slate-300 rounded px-2 py-1 text-[11px] focus:outline-none">
              ${moveOptions}
            </select>
            <div class="flex items-center gap-2">
              ${w.deck !== MEMORY_PALACE_DECK ? `<button onclick="moveWordToDeck('${w.id}', '${MEMORY_PALACE_DECK}')" class="text-amber-400 hover:text-amber-300 transition p-1" title="移至記憶宮殿"><i class="fa-solid fa-castle"></i></button>` : ''}
              <button onclick="deleteWord('${w.id}')" class="text-slate-500 hover:text-rose-400 transition p-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function moveWordToDeck(wordId, newDeck) {
      const word = db.words.find(w => w.id === wordId);
      if (word) {
        word.deck = newDeck;
        saveDatabase();
        renderWordCards();
        showToast(`單字已移至「${newDeck}」`, 'info');
      }
    }

    function deleteWord(wordId) {
      db.words = db.words.filter(w => w.id !== wordId);
      saveDatabase();
      renderWordCards();
      showToast('單字已刪除', 'info');
    }

    // --- Direct Batch Input & AI Resolution Engine ---
    async function processBatchInput() {
      const inputEl = document.getElementById('batch-input-terms');
      const rawText = inputEl.value.trim();
      if (!rawText) {
        showToast('請輸入至少一個英文單字', 'error');
        return;
      }

      const rawTerms = rawText.split(/[\n,]+/).map(t => t.trim()).filter(t => t.length > 0);
      if (rawTerms.length === 0) return;

      const btn = document.getElementById('btn-batch-add');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在 AI 智慧解析...`;

      const targetDeck = db.activeDeck === '全部分類' ? '預設單字本' : db.activeDeck;

      try {
        let results = [];
        if (db.settings.geminiApiKey) {
          try {
            results = await callGeminiBatch(rawTerms);
          } catch (aiErr) {
            console.warn("API 呼叫失敗，自動啟動本地備用字典引擎", aiErr);
            results = rawTerms.map(t => fallbackLocalWordLookup(t));
            showToast('雲端 API 忙碌中，已自動切換本地備用引擎完成解析', 'info');
          }
        } else {
          results = rawTerms.map(t => fallbackLocalWordLookup(t));
        }

        results.forEach(w => {
          db.words.unshift({
            id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            deck: targetDeck,
            term: w.term,
            pos: w.pos || 'n.',
            phonetic: w.phonetic || '',
            meaning: w.meaning,
            synonyms: w.synonyms || [],
            example: w.example || '',
            srsStage: 0,
            nextReviewDate: new Date().toISOString()
          });
        });

        saveDatabase();
        renderWordCards();
        inputEl.value = '';
        showToast(`成功新增 ${results.length} 個單字至「${targetDeck}」！`, 'success');
      } catch (err) {
        showToast('解析出錯: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵 AI 智慧解析與加入`;
      }
    }

    async function callGeminiBatch(terms) {
      const prompt = `Analyze these English words: ${JSON.stringify(terms)}. Return ONLY a valid JSON array of objects, each containing: term, pos (n./v./adj.), phonetic (IPA), meaning (Traditional Chinese), synonyms (array of 1-2 words), example (simple English sentence). No markdown formatting blocks.`;
      const response = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${db.settings.geminiApiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      }, 15000);

      const data = await response.json();
      const text = data.candidates[0].content.parts[0].text;
      const cleanJson = text.replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(cleanJson);
    }

    function fallbackLocalWordLookup(term) {
      return {
        term: term.toLowerCase(),
        pos: 'n. / v.',
        phonetic: `/${term.toLowerCase()}/`,
        meaning: `${term} 的常用中文釋義`,
        synonyms: ['related'],
        example: `This sentence demonstrates the usage of ${term}.`
      };
    }

    // --- Ebbinghaus SRS Logic ---
    const SRS_INTERVALS_DAYS = [1, 2, 4, 7, 15, 30];

    function updateSrsQueue() {
      const now = new Date();
      srsQueue = db.words.filter(w => new Date(w.nextReviewDate) <= now);
      const badge = document.getElementById('srs-count-badge');
      if (srsQueue.length > 0) {
        badge.innerText = srsQueue.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function prepareSrsSession() {
      updateSrsQueue();
      currentSrsIndex = 0;
      document.getElementById('srs-due-count').innerText = srsQueue.length;
      document.getElementById('srs-deck-title').innerText = db.activeDeck;
      renderCurrentSrsCard();
    }

    function renderCurrentSrsCard() {
      const innerCard = document.getElementById('srs-card-inner');
      innerCard.classList.remove('rotate-y-180');
      if (srsQueue.length === 0 || currentSrsIndex >= srsQueue.length) {
        document.getElementById('srs-front-word').innerText = "太棒了！";
        document.getElementById('srs-front-phonetic').innerText = "目前沒有需要複習的單字";
        document.getElementById('srs-controls').classList.add('hidden');
        return;
      }
      document.getElementById('srs-controls').classList.remove('hidden');
      const w = srsQueue[currentSrsIndex];
      document.getElementById('srs-front-word').innerText = w.term;
      document.getElementById('srs-front-phonetic').innerText = w.phonetic || '';
      document.getElementById('srs-back-pos').innerText = w.pos || 'n.';
      document.getElementById('srs-back-meaning').innerText = w.meaning;
      document.getElementById('srs-back-synonyms').innerText = (w.synonyms || []).join(', ') || '無';
      document.getElementById('srs-back-example').innerText = w.example || '尚無例句';
    }

    function flipSrsCard() {
      document.getElementById('srs-card-inner').classList.toggle('rotate-y-180');
    }

    function rateSrsWord(grade) {
      if (srsQueue.length === 0 || currentSrsIndex >= srsQueue.length) return;
      const word = srsQueue[currentSrsIndex];
      let nextStage = word.srsStage || 0;
      if (grade === 1) nextStage = 0;
      else if (grade === 2) nextStage = Math.min(nextStage + 1, SRS_INTERVALS_DAYS.length - 1);
      else if (grade === 3) nextStage = Math.min(nextStage + 2, SRS_INTERVALS_DAYS.length - 1);

      const daysToAdd = SRS_INTERVALS_DAYS[nextStage];
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + daysToAdd);
      word.srsStage = nextStage;
      word.nextReviewDate = nextDate.toISOString();
      saveDatabase();
      currentSrsIndex++;
      document.getElementById('srs-due-count').innerText = Math.max(0, srsQueue.length - currentSrsIndex);
      renderCurrentSrsCard();
    }

    function moveCurrentSrsToPalace() {
      if (srsQueue.length === 0 || currentSrsIndex >= srsQueue.length) return;
      const word = srsQueue[currentSrsIndex];
      moveWordToDeck(word.id, MEMORY_PALACE_DECK);
      rateSrsWord(3);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // --- Smart Text Extraction ---
    async function processTextExtraction() {
      const prefix = document.getElementById('extract-deck-prefix').value.trim() || '文章提取單字';
      const text = document.getElementById('extract-input-text').value.trim();
      if (!text) { showToast('請貼上文章內容', 'error'); return; }

      const btn = document.getElementById('btn-start-extract');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 智慧提取與分拆中...`;

      try {
        const maxChunkLen = 2500;
        const chunks = [];
        for (let i = 0; i < text.length; i += maxChunkLen) {
          chunks.push(text.substring(i, i + maxChunkLen));
        }

        for (let idx = 0; idx < chunks.length; idx++) {
          const deckName = chunks.length > 1 ? `${prefix} - Part ${idx + 1}` : prefix;
          if (!db.decks.includes(deckName)) db.decks.push(deckName);

          let wordsFound = [];
          if (db.settings.geminiApiKey) {
            try {
              wordsFound = await callGeminiBatch(extractTermsFromText(chunks[idx]));
            } catch (e) {
              wordsFound = fallbackTextExtraction(chunks[idx]);
            }
          } else {
            wordsFound = fallbackTextExtraction(chunks[idx]);
          }

          wordsFound.forEach(w => {
            db.words.unshift({
              id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
              deck: deckName,
              term: w.term,
              pos: w.pos || 'n.',
              phonetic: w.phonetic || '',
              meaning: w.meaning,
              synonyms: w.synonyms || [],
              example: w.example || '',
              srsStage: 0,
              nextReviewDate: new Date().toISOString()
            });
          });
        }

        saveDatabase();
        renderDecks();
        switchView('dash');
        showToast(`成功建立單字本並提取單字！`, 'success');
      } catch (err) {
        showToast('提取過程出錯: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> 開始智慧提取並建立單字本`;
      }
    }

    function extractTermsFromText(textChunk) {
      const matches = textChunk.match(/\b[A-Za-z]{6,}\b/g) || [];
      return Array.from(new Set(matches)).slice(0, 12);
    }

    function fallbackTextExtraction(textChunk) {
      return extractTermsFromText(textChunk).map(term => fallbackLocalWordLookup(term));
    }

    // --- GitHub Gist Cloud Sync ---
    function updateGistStatusUI() {
      const textEl = document.getElementById('gist-status-text');
      if (db.settings.gistToken && db.settings.gistId) {
        textEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Gist 已連線 (${db.settings.gistId.substr(0, 6)}...)`;
      } else if (db.settings.gistToken) {
        textEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> 已就緒 (待建立/綁定 Gist)`;
      } else {
        textEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span> 未綁定 GitHub Token`;
      }
    }

    function getAuthHeaders(token) {
      const cleanToken = token.trim();
      const authValue = cleanToken.startsWith('ghp_') || cleanToken.startsWith('github_pat_') ? `Bearer ${cleanToken}` : `token ${cleanToken}`;
      return { 'Accept': 'application/vnd.github+json', 'Authorization': authValue, 'Content-Type': 'application/json' };
    }

    async function syncToGist() {
      if (!db.settings.gistToken) {
        showToast('請先至設定填入 GitHub Personal Access Token', 'error');
        openModal('settings-modal');
        return;
      }
      showToast('正在備份上傳至 GitHub Gist...', 'info');
      const payload = {
        description: 'VocabMaster Cloud Database Sync',
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(db, null, 2) } }
      };
      try {
        let url = 'https://api.github.com/gists';
        let method = 'POST';
        if (db.settings.gistId) {
          url = `https://api.github.com/gists/${db.settings.gistId}`;
          method = 'PATCH';
        }
        const res = await fetchWithTimeout(url, { method: method, headers: getAuthHeaders(db.settings.gistToken), body: JSON.stringify(payload) }, 15000);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.id) {
          db.settings.gistId = data.id;
          saveDatabase();
          updateGistStatusUI();
          showToast('成功上傳備份至 Gist！', 'success');
        }
      } catch (err) {
        showToast('Gist 上傳失敗: ' + err.message, 'error');
      }
    }

    async function syncFromGist() {
      if (!db.settings.gistToken || !db.settings.gistId) {
        showToast('缺少 Gist Token 或 Gist ID', 'error');
        openModal('settings-modal');
        return;
      }
      showToast('正在從 Gist 下載同步資料...', 'info');
      try {
        const res = await fetchWithTimeout(`https://api.github.com/gists/${db.settings.gistId}`, { method: 'GET', headers: getAuthHeaders(db.settings.gistToken) }, 15000);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.files && data.files[GIST_FILENAME]) {
          db = JSON.parse(data.files[GIST_FILENAME].content);
          saveDatabase();
          ensureMemoryPalaceDeck();
          renderDecks();
          renderWordCards();
          showToast('已成功從 Gist 同步最新單字庫！', 'success');
        } else {
          throw new Error('未找到備份檔案');
        }
      } catch (err) {
        showToast('Gist 下載失敗: ' + err.message, 'error');
      }
    }

    function exportBackupJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `VocabMaster_Backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('JSON 備份檔已匯出', 'success');
    }

    function importBackupJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          db = JSON.parse(e.target.result);
          saveDatabase();
          ensureMemoryPalaceDeck();
          renderDecks();
          renderWordCards();
          closeModal('settings-modal');
          showToast('資料已成功還原！', 'success');
        } catch (err) {
          showToast('匯入失敗: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    function fetchWithTimeout(resource, options = {}, timeout = 15000) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const id = setTimeout(() => { controller.abort(); reject(new Error('請求超時')); }, timeout);
        fetch(resource, { ...options, signal: controller.signal })
          .then(res => { clearTimeout(id); resolve(res); })
          .catch(err => { clearTimeout(id); reject(err); });
      });
    }
  </script>
