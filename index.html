<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - 智慧單字庫與學習助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-flip { perspective: 1000px; }
    .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-brain-circuit text-xl text-amber-300"></i>
        <h1 class="text-lg font-bold tracking-tight">VocabMaster</h1>
      </div>
      <div class="flex items-center space-x-1.5 sm:space-x-2">
        <button onclick="switchTab('notebooks')" id="tab-notebooks" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-indigo-700 text-white shadow">
          <i class="fa-solid fa-folder-open mr-1"></i>單字本
        </button>
        <button onclick="switchTab('batch')" id="tab-batch" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-indigo-100 hover:bg-indigo-700 transition">
          <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>逐字稿提取
        </button>
        <button onclick="openSettingsModal()" class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-indigo-100 hover:bg-indigo-700 transition">
          <i class="fa-solid fa-gear mr-1"></i>設定
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-grow w-full">

    <!-- 頁面一：單字本管理與單字卡清單 -->
    <section id="sec-notebooks" class="space-y-4 sm:space-y-6">
      
      <!-- 單字本選擇區與功能按鈕 -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 overflow-x-auto py-1 scrollbar-none" id="notebook-tabs-container">
          <!-- 動態生成單字本按鈕 -->
        </div>
        <div class="flex items-center space-x-2 shrink-0">
          <button onclick="openBatchWordsModal()" class="flex-1 sm:flex-none px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs sm:text-sm font-semibold rounded-lg transition border border-indigo-200">
            <i class="fa-solid fa-list-check mr-1"></i> 批次單字
          </button>
          <button onclick="openCreateNotebookModal()" class="flex-1 sm:flex-none px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-lg transition">
            <i class="fa-solid fa-plus mr-1"></i> 新增
          </button>
          <button onclick="startReview()" class="flex-1 sm:flex-none px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition">
            <i class="fa-solid fa-layer-group mr-1"></i> 複習 (<span id="due-review-count">0</span>)
          </button>
        </div>
      </div>

      <!-- 單字本標題列 & 快速單字輸入 -->
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-3 sm:space-y-4">
        <div class="flex justify-between items-center">
          <h2 id="current-notebook-title" class="text-lg sm:text-xl font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-book text-indigo-600 mr-2"></i> 預設收集箱
          </h2>
          <span id="current-notebook-count" class="text-xs sm:text-sm font-medium bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full">0 個單字</span>
        </div>

        <!-- 快速新增單字輸入框 -->
        <div>
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">快速新增單字（支援離線儲存與 AI 補齊）</label>
          <div class="flex gap-2">
            <input type="text" id="quick-word-input" placeholder="輸入單字，例如: resilient..." class="flex-grow min-w-0 px-3 sm:px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <button onclick="autoAddWord()" id="btn-auto-add" class="px-3.5 sm:px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold rounded-lg shadow-sm transition shrink-0 flex items-center">
              <i class="fa-solid fa-sparkles mr-1.5"></i> AI生成
            </button>
          </div>
        </div>
      </div>

      <!-- 單字卡清單列表 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-3.5 sm:p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center flex-wrap gap-2">
          <h3 class="font-semibold text-slate-700 text-sm sm:text-base">單字列表</h3>
          <button onclick="fillPendingWords()" id="btn-fill-pending" class="text-xs px-2.5 py-1 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 font-semibold rounded-lg transition flex items-center">
            <i class="fa-solid fa-bolt mr-1"></i> 一鍵補齊待生成單字
          </button>
        </div>
        <div id="words-container" class="divide-y divide-slate-100">
          <!-- 動態生成單字項目 -->
        </div>
      </div>
    </section>

    <!-- 頁面二：YouTube/逐字稿 AI 批次提取與匯入 -->
    <section id="sec-batch" class="hidden space-y-4 sm:space-y-6">
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-wand-magic-sparkles text-indigo-600 mr-2"></i> YouTube / 逐字稿智慧提取
          </h2>
          <p class="text-xs sm:text-sm text-slate-500 mt-1">貼上文章或字幕，AI 將依長度動態調整擷取數量，且例句嚴格取自原文上下文。</p>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">目標儲存單字本</label>
          <select id="batch-target-notebook" class="w-full md:w-64 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            <!-- 動態選項 -->
          </select>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">貼上英文逐字稿 / 文章內容</label>
          <textarea id="batch-text-input" rows="6" placeholder="將影片字幕或文章段落貼於此..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
        </div>

        <div class="flex justify-end">
          <button onclick="processBatchText()" id="btn-process-batch" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition flex items-center justify-center">
            <i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i> AI提取
          </button>
        </div>
      </div>

      <!-- 提取預覽區 -->
      <div id="batch-results-wrapper" class="hidden bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm sm:text-base">AI 提取預覽</h3>
          <button onclick="confirmBatchImport()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition">
            匯入勾選單字
          </button>
        </div>
        <div id="batch-preview-list" class="space-y-2.5">
          <!-- 動態生成的預覽單字 -->
        </div>
      </div>
    </section>

  </main>

  <!-- 彈出視窗：批次單字手動輸入 -->
  <div id="modal-batch-words" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-900 text-base sm:text-lg flex items-center">
          <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> 批次單字輸入
        </h3>
        <button onclick="closeBatchWordsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">請貼上英文單字列表（可用逗號或換行隔開）</label>
        <textarea id="batch-words-list-input" rows="5" placeholder="例如:&#10;resilient&#10;mitigate, ephemeral" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeBatchWordsModal()" class="px-3.5 py-2 text-slate-600 hover:bg-slate-100 text-xs sm:text-sm font-medium rounded-lg">取消</button>
        <button onclick="processBatchSingleWords()" id="btn-process-batch-words" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg shadow">AI解析</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗：單字移動/歸檔 -->
  <div id="modal-move-word" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 sm:p-6 shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-base sm:text-lg">移動單字至其他單字本</h3>
      <div>
        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">選擇目標單字本</label>
        <select id="move-target-notebook" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          <!-- 動態選項 -->
        </select>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeMoveWordModal()" class="px-3.5 py-2 text-slate-600 hover:bg-slate-100 text-xs sm:text-sm font-medium rounded-lg">取消</button>
        <button onclick="confirmMoveWord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg">確認移動</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗：設定 -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4 overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-900 text-base sm:text-lg flex items-center">
          <i class="fa-solid fa-gear text-indigo-600 mr-2"></i> 系統與 Gist 自動同步
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Gemini API Key</label>
          <input type="password" id="setting-api-key" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">GitHub Personal Access Token (PAT)</label>
          <input type="password" id="setting-github-token" placeholder="ghp_..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
          <p class="text-[11px] text-slate-500 mt-1">須勾選 `gist` 權限。填入後將自動全時雲端同步！</p>
        </div>

        <div class="border-t pt-3 flex gap-2">
          <button onclick="manualSyncFromGist()" class="flex-1 px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-lg border border-indigo-200 transition">
            <i class="fa-solid fa-cloud-arrow-down mr-1"></i> 手動從 Gist 同步
          </button>
          <button onclick="manualSyncToGist()" class="flex-1 px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-lg border border-emerald-200 transition">
            <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 手動上傳至 Gist
          </button>
        </div>

        <div class="border-t pt-3">
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-2">JSON 備份與匯入</label>
          <div class="flex gap-2">
            <button onclick="exportData()" class="flex-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition">
              <i class="fa-solid fa-download mr-1"></i> 匯出 JSON
            </button>
            <label class="flex-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition text-center cursor-pointer">
              <i class="fa-solid fa-upload mr-1"></i> 匯入 JSON
              <input type="file" onchange="importData(event)" accept=".json" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="saveSettings()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg shadow">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗：新增單字本 -->
  <div id="modal-notebook" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 sm:p-6 shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-base sm:text-lg">新增單字本</h3>
      <div>
        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">單字本名稱</label>
        <input type="text" id="new-notebook-name" placeholder="例如: 🏛️ 記憶宮殿, 🎬 YouTube觀影..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeCreateNotebookModal()" class="px-3.5 py-2 text-slate-600 hover:bg-slate-100 text-xs sm:text-sm font-medium rounded-lg">取消</button>
        <button onclick="createNotebook()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg">建立</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗：艾賓豪斯閃卡複習 -->
  <div id="modal-review" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-50">
    <div class="w-full max-w-lg flex justify-between items-center text-white mb-3">
      <div class="text-xs sm:text-sm font-medium" id="review-progress">卡片 1 / 10</div>
      <button onclick="closeReviewModal()" class="text-slate-300 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- 閃卡卡片主體 -->
    <div onclick="flipCard()" class="card-flip w-full max-w-lg h-72 sm:h-80 cursor-pointer">
      <div id="review-card-inner" class="card-inner relative w-full h-full">
        <!-- 正面 -->
        <div class="card-front absolute inset-0 bg-white rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col justify-between items-center text-center border border-slate-200">
          <div class="text-[11px] font-semibold text-indigo-500 tracking-wider uppercase">點擊翻卡查看詳細與評分</div>
          <div>
            <div id="review-word" class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-2">Word</div>
            <div id="review-synonyms" class="text-xs sm:text-sm text-indigo-600 font-medium bg-indigo-50 px-3 py-1 rounded-full inline-block mt-1">Synonyms</div>
          </div>
          <div class="text-xs text-slate-400">點擊任意處翻頁</div>
        </div>
        <!-- 背面 -->
        <div class="card-back absolute inset-0 bg-indigo-900 text-white rounded-2xl shadow-2xl p-5 sm:p-6 flex flex-col justify-between overflow-y-auto">
          <div class="space-y-2.5">
            <div class="flex justify-between items-baseline border-b border-indigo-800 pb-2">
              <span id="review-word-back" class="text-xl sm:text-2xl font-bold">Word</span>
              <span id="review-meaning" class="text-amber-300 font-medium text-xs sm:text-sm">釋義</span>
            </div>
            <div>
              <div class="text-[11px] text-indigo-300 font-semibold mb-0.5">常用片語</div>
              <div id="review-phrases" class="text-xs sm:text-sm text-indigo-100 font-medium">Phrases</div>
            </div>
            <div>
              <div class="text-[11px] text-indigo-300 font-semibold mb-0.5">情境例句</div>
              <div id="review-sentence" class="text-xs sm:text-sm italic text-slate-200">Sentence</div>
              <div id="review-translation" class="text-[11px] text-slate-400 mt-0.5">Translation</div>
            </div>
          </div>
          <div class="text-center text-[11px] text-indigo-300 pt-2 border-t border-indigo-800">請在下方選擇熟悉度評分</div>
        </div>
      </div>
    </div>

    <!-- SRS 熟悉度評分按鈕 -->
    <div id="srs-buttons" class="hidden flex space-x-2.5 sm:space-x-3 mt-4 sm:mt-6 w-full max-w-lg">
      <button onclick="handleSRS('again')" class="flex-1 py-2.5 sm:py-3 bg-rose-600 hover:bg-rose-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow transition flex flex-col items-center">
        <span>🔴 重來</span>
        <span class="text-[10px] font-normal opacity-80">1 天後</span>
      </button>
      <button onclick="handleSRS('good')" class="flex-1 py-2.5 sm:py-3 bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold rounded-xl shadow transition flex flex-col items-center">
        <span>🟡 良好</span>
        <span class="text-[10px] font-normal opacity-80">天數翻倍</span>
      </button>
      <button onclick="handleSRS('easy')" class="flex-1 py-2.5 sm:py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow transition flex flex-col items-center">
        <span>🟢 簡單</span>
        <span class="text-[10px] font-normal opacity-80">7+ 天後</span>
      </button>
    </div>
  </div>

  <script>
    let appData = {
      apiKey: '',
      githubToken: '',
      gistId: '',
      activeNotebookId: 'default',
      notebooks: [
        { id: 'default', name: '📥 預設收集箱' },
        { id: 'palace', name: '🏛️ 記憶宮殿' },
        { id: 'yt-study', name: '🎬 YouTube 觀影學習' }
      ],
      words: [
        {
          id: 'w1',
          notebookId: 'default',
          word: 'resilient',
          type: 'adj.',
          meaning: '有韌性的；適應力強的',
          synonyms: 'flexible, tough',
          phrases: 'stay resilient',
          sentence: 'Local businesses proved remarkably resilient during the crisis.',
          translation: '當地企業在危機期間展現出非凡的韌性。',
          nextReviewDate: new Date().toISOString().slice(0, 10),
          interval: 1,
          repetitions: 0,
          status: 'ready'
        }
      ]
    };

    let extractedBatchWords = [];
    let reviewQueue = [];
    let reviewIndex = 0;
    let wordToMoveId = null;

    async function fetchWithTimeout(url, options, timeoutMs = 15000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        if (err.name === 'AbortError') throw new Error('API 請求超時（15秒未回應）！');
        throw err;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        loadLocalStorage();
        if (appData.githubToken) {
          await syncFromGist();
        }
        renderNotebookTabs();
        renderWords();
        updateDueReviewCount();
      } catch (e) {
        console.error("Init Error:", e);
      }
    });

    function saveLocalStorage() {
      try {
        localStorage.setItem('vocabmaster_data', JSON.stringify(appData));
        updateDueReviewCount();
        if (appData.githubToken) {
          syncToGist();
        }
      } catch (e) { console.error("Save Error:", e); }
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('vocabmaster_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.notebooks && parsed.words) appData = parsed;
        } catch (e) { console.error("Parse Error:", e); }
      }
      document.getElementById('setting-api-key').value = appData.apiKey || '';
      document.getElementById('setting-github-token').value = appData.githubToken || '';
    }

    // 強化版 Gist 同步：透過檔名尋找，確保抓得到
    async function syncToGist() {
      if (!appData.githubToken) return;
      const fileName = "vocabmaster_database.json";
      const content = JSON.stringify(appData, null, 2);

      try {
        if (!appData.gistId) {
          // 先在遠端搜尋有沒有已經存在的 vocabmaster_database.json
          const listRes = await fetch('https://api.github.com/gists', {
            headers: { 'Authorization': `token ${appData.githubToken}` }
          });
          const gists = await listRes.json();
          if (Array.isArray(gists)) {
            const found = gists.find(g => g.files && g.files[fileName]);
            if (found) appData.gistId = found.id;
          }
        }

        if (!appData.gistId) {
          // 建立新 Gist
          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Authorization': `token ${appData.githubToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ description: "VocabMaster Cloud Database", public: false, files: { [fileName]: { content } } })
          });
          const data = await res.json();
          if (data.id) { appData.gistId = data.id; localStorage.setItem('vocabmaster_data', JSON.stringify(appData)); }
        } else {
          // 更新已有 Gist
          await fetch(`https://api.github.com/gists/${appData.gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${appData.githubToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: { [fileName]: { content } } })
          });
        }
      } catch (err) { console.error("Gist Sync Error:", err); }
    }

    async function syncFromGist() {
      if (!appData.githubToken) return;
      const fileName = "vocabmaster_database.json";
      try {
        const res = await fetch('https://api.github.com/gists', {
          headers: { 'Authorization': `token ${appData.githubToken}` }
        });
        const gists = await res.json();
        if (!Array.isArray(gists)) return;

        const targetGist = gists.find(g => g.files && g.files[fileName]);
        if (targetGist && targetGist.files[fileName]) {
          appData.gistId = targetGist.id;
          const rawRes = await fetch(targetGist.files[fileName].raw_url);
          const cloudData = await rawRes.json();
          if (cloudData && cloudData.words) {
            appData = cloudData;
            localStorage.setItem('vocabmaster_data', JSON.stringify(appData));
            renderNotebookTabs();
            renderWords();
          }
        }
      } catch (err) { console.error("Gist Download Error:", err); }
    }

    async function manualSyncFromGist() {
      await syncFromGist();
      alert('已成功從雲端 Gist 同步最新資料！');
    }

    async function manualSyncToGist() {
      await syncToGist();
      alert('已成功將本地資料上傳至雲端 Gist！');
    }

    function updateDueReviewCount() {
      const today = new Date().toISOString().slice(0, 10);
      const dueWords = appData.words.filter(w => w.notebookId === appData.activeNotebookId && (!w.nextReviewDate || w.nextReviewDate <= today));
      const el = document.getElementById('due-review-count');
      if (el) el.innerText = dueWords.length;
    }

    function switchTab(tabName) {
      document.getElementById('sec-notebooks').classList.toggle('hidden', tabName !== 'notebooks');
      document.getElementById('sec-batch').classList.toggle('hidden', tabName !== 'batch');
      document.getElementById('tab-notebooks').className = tabName === 'notebooks' ? 'px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-indigo-700 text-white shadow' : 'px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-indigo-100 hover:bg-indigo-700';
      document.getElementById('tab-batch').className = tabName === 'batch' ? 'px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-indigo-700 text-white shadow' : 'px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-indigo-100 hover:bg-indigo-700';
      if (tabName === 'batch') updateBatchNotebookSelect();
    }

    function renderNotebookTabs() {
      const container = document.getElementById('notebook-tabs-container');
      if (!container) return;
      container.innerHTML = '';
      appData.notebooks.forEach(nb => {
        const isActive = nb.id === appData.activeNotebookId;
        const btn = document.createElement('button');
        btn.className = `px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
        btn.innerText = nb.name;
        btn.onclick = () => { appData.activeNotebookId = nb.id; saveLocalStorage(); renderNotebookTabs(); renderWords(); };
        container.appendChild(btn);
      });
      const currentNb = appData.notebooks.find(n => n.id === appData.activeNotebookId) || appData.notebooks[0];
      document.getElementById('current-notebook-title').innerHTML = `<i class="fa-solid fa-book text-indigo-600 mr-2"></i> ${currentNb.name}`;
    }

    function openCreateNotebookModal() { document.getElementById('modal-notebook')?.classList.remove('hidden'); }
    function closeCreateNotebookModal() { document.getElementById('modal-notebook')?.classList.add('hidden'); }

    function createNotebook() {
      const nameInput = document.getElementById('new-notebook-name');
      const name = nameInput.value.trim();
      if (!name) return;
      const newId = 'nb_' + Date.now();
      appData.notebooks.push({ id: newId, name: name });
      appData.activeNotebookId = newId;
      nameInput.value = '';
      closeCreateNotebookModal();
      saveLocalStorage();
      renderNotebookTabs();
      renderWords();
    }

    function openMoveWordModal(id) {
      wordToMoveId = id;
      const select = document.getElementById('move-target-notebook');
      select.innerHTML = '';
      appData.notebooks.forEach(nb => {
        if (nb.id !== appData.activeNotebookId) {
          const opt = document.createElement('option');
          opt.value = nb.id;
          opt.innerText = nb.name;
          select.appendChild(opt);
        }
      });
      document.getElementById('modal-move-word')?.classList.remove('hidden');
    }

    function closeMoveWordModal() { wordToMoveId = null; document.getElementById('modal-move-word')?.classList.add('hidden'); }

    function confirmMoveWord() {
      if (!wordToMoveId) return;
      const targetId = document.getElementById('move-target-notebook').value;
      const word = appData.words.find(w => w.id === wordToMoveId);
      if (word) { word.notebookId = targetId; saveLocalStorage(); renderWords(); }
      closeMoveWordModal();
    }

    function renderWords() {
      const container = document.getElementById('words-container');
      const currentWords = appData.words.filter(w => w.notebookId === appData.activeNotebookId);
      document.getElementById('current-notebook-count').innerText = `${currentWords.length} 個單字`;

      if (currentWords.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs sm:text-sm"><i class="fa-solid fa-folder-open text-3xl mb-2"></i><p>這裡空空如也，輸入單字開始建立吧！</p></div>`;
        return;
      }

      container.innerHTML = '';
      currentWords.forEach(w => {
        const item = document.createElement('div');
        item.className = 'p-3.5 sm:p-4 hover:bg-slate-50/80 transition flex flex-col md:flex-row md:items-center justify-between gap-2.5';
        const isPending = w.status === 'pending';

        item.innerHTML = `
          <div class="space-y-1 max-w-2xl">
            <div class="flex items-center space-x-2 flex-wrap">
              <span class="text-base sm:text-lg font-bold text-slate-900">${w.word}</span>
              <span class="text-[11px] px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded font-medium">${w.type || ''}</span>
              <span class="text-xs sm:text-sm font-semibold ${isPending ? 'text-amber-600 bg-amber-50 px-2 py-0.5 rounded' : 'text-indigo-700'}">${isPending ? '⏳ 待 AI 生成' : w.meaning}</span>
              <button onclick="speakText('${w.word.replace(/'/g, "\\'")}')" class="text-indigo-500 hover:text-indigo-700 text-xs ml-1"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            ${!isPending ? `
            <div class="text-[11px] sm:text-xs text-slate-500 flex flex-wrap gap-2">
              <span><strong class="text-slate-600">同義:</strong> ${w.synonyms || '無'}</span>
              <span>•</span>
              <span><strong class="text-slate-600">片語:</strong> ${w.phrases || '無'}</span>
            </div>
            <div class="text-[11px] sm:text-xs text-slate-600 italic bg-slate-100/70 p-1.5 sm:p-2 rounded border border-slate-200/60 mt-1">
              "${w.sentence || ''}" <span class="text-slate-500 not-italic ml-1.5">(${w.translation || ''})</span>
            </div>` : ''}
          </div>
          <div class="flex items-center space-x-2 shrink-0 self-end md:self-center">
            ${isPending ? `<button onclick="singleFetchWord('${w.id}')" class="text-xs px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-lg shadow-sm transition"><i class="fa-solid fa-sparkles mr-1"></i>AI生成</button>` : ''}
            <button onclick="openMoveWordModal('${w.id}')" title="移動" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 font-medium rounded-lg border border-slate-200 transition">
              <i class="fa-solid fa-arrow-right-to-bracket mr-1"></i>移動
            </button>
            <button onclick="deleteWord('${w.id}')" class="text-slate-400 hover:text-rose-600 text-xs p-1"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function deleteWord(id) {
      appData.words = appData.words.filter(w => w.id !== id);
      saveLocalStorage();
      renderWords();
    }

    async function autoAddWord() {
      const input = document.getElementById('quick-word-input');
      const word = input.value.trim();
      if (!word) return;

      const today = new Date().toISOString().slice(0, 10);
      const newWordObj = {
        id: 'w_' + Date.now(),
        notebookId: appData.activeNotebookId,
        word: word,
        type: '', meaning: '', synonyms: '', phrases: '', sentence: '', translation: '',
        nextReviewDate: today, interval: 1, repetitions: 0,
        status: 'pending'
      };

      appData.words.unshift(newWordObj);
      input.value = '';
      saveLocalStorage();
      renderWords();

      if (appData.apiKey) {
        singleFetchWord(newWordObj.id);
      } else {
        alert('已加入待生成清單！記得在右上角設定填入 API Key 才能執行 AI 生成。');
      }
    }

    async function singleFetchWord(wordId) {
      const wordObj = appData.words.find(w => w.id === wordId);
      if (!wordObj) return;
      if (!appData.apiKey) { alert('請先在右上角「設定」填入 Gemini API Key！'); openSettingsModal(); return; }

      try {
        const details = await fetchWordDetailsFromAI(wordObj.word);
        Object.assign(wordObj, details);
        wordObj.status = 'ready';
        saveLocalStorage();
        renderWords();
      } catch (err) {
        console.error("Fetch Word Error:", err);
        alert('AI 生成失敗: ' + err.message);
      }
    }

    async function fillPendingWords() {
      const pendings = appData.words.filter(w => w.notebookId === appData.activeNotebookId && w.status === 'pending');
      if (pendings.length === 0) { alert('目前沒有需要補齊的單字！'); return; }
      if (!appData.apiKey) { alert('請先填入 Gemini API Key！'); openSettingsModal(); return; }

      const btn = document.getElementById('btn-fill-pending');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> 處理中...`;

      for (let w of pendings) {
        await singleFetchWord(w.id);
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-bolt mr-1"></i> 一鍵補齊待生成單字`;
    }

    async function fetchWordDetailsFromAI(word) {
      const prompt = `針對英文單字 "${word}" 提供學習資訊。極速回傳標準 JSON：
      {"type":"詞性縮寫","meaning":"中文釋義","synonyms":"1-2個同義詞","phrases":"1-2個片語","sentence":"簡短例句","translation":"例句翻譯"}`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${appData.apiKey}`;
      const response = await fetchWithTimeout(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      }, 15000);

      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'API 請求失敗，請檢查 Key');
      let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(rawText);
    }

    function openBatchWordsModal() { document.getElementById('modal-batch-words')?.classList.remove('hidden'); }
    function closeBatchWordsModal() { document.getElementById('modal-batch-words')?.classList.add('hidden'); }

    async function processBatchSingleWords() {
      const textInput = document.getElementById('batch-words-list-input');
      const rawText = textInput.value.trim();
      if (!rawText) return;

      const wordList = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
      const today = new Date().toISOString().slice(0, 10);

      wordList.forEach((w, idx) => {
        appData.words.unshift({
          id: 'w_' + Date.now() + '_' + idx,
          notebookId: appData.activeNotebookId,
          word: w, type: '', meaning: '', synonyms: '', phrases: '', sentence: '', translation: '',
          nextReviewDate: today, interval: 1, repetitions: 0,
          status: 'pending'
        });
      });

      saveLocalStorage();
      renderWords();
      closeBatchWordsModal();
      textInput.value = '';

      if (appData.apiKey) fillPendingWords();
    }

    function updateBatchNotebookSelect() {
      const select = document.getElementById('batch-target-notebook');
      select.innerHTML = '';
      appData.notebooks.forEach(nb => {
        const opt = document.createElement('option');
        opt.value = nb.id;
        opt.innerText = nb.name;
        if (nb.id === appData.activeNotebookId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    async function processBatchText() {
      const textInput = document.getElementById('batch-text-input');
      const text = textInput.value.trim();
      if (!text) return;
      if (!appData.apiKey) { alert('請先填入 Gemini API Key！'); openSettingsModal(); return; }

      const btn = document.getElementById('btn-process-batch');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> AI提取中...`;

      try {
        const prompt = `分析英文文章，挑選關鍵單字，例句 (sentence) 必須完全採用原文句子。回傳 JSON 陣列：
        word, type, meaning, synonyms, phrases, sentence, translation
        
        文章：${text}`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${appData.apiKey}`;
        const response = await fetchWithTimeout(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
        }, 25000);

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'API 請求失敗');
        let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        extractedBatchWords = JSON.parse(rawText);
        renderBatchPreview();
      } catch (err) {
        alert('提取失敗: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i> AI提取`;
      }
    }

    function renderBatchPreview() {
      const wrapper = document.getElementById('batch-results-wrapper');
      const container = document.getElementById('batch-preview-list');
      wrapper.classList.remove('hidden');
      container.innerHTML = '';

      extractedBatchWords.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'p-3 bg-slate-50 border rounded-lg flex items-start space-x-2.5';
        div.innerHTML = `
          <input type="checkbox" id="batch-chk-${idx}" checked class="mt-1 h-4 w-4 text-indigo-600 rounded">
          <div class="text-xs sm:text-sm">
            <span class="font-bold text-slate-900">${item.word}</span> <span class="text-slate-500">(${item.type || ''})</span> - <span class="text-indigo-700 font-semibold">${item.meaning || ''}</span>
            <div class="text-[11px] text-slate-500 mt-0.5">同義: ${item.synonyms || ''} | 片語: ${item.phrases || ''}</div>
            <div class="text-[11px] text-slate-600 italic mt-1 bg-white p-1.5 rounded border border-slate-200">"${item.sentence || ''}" (${item.translation || ''})</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function confirmBatchImport() {
      const targetNbId = document.getElementById('batch-target-notebook').value;
      let count = 0;
      const today = new Date().toISOString().slice(0, 10);
      
      extractedBatchWords.forEach((item, idx) => {
        const chk = document.getElementById(`batch-chk-${idx}`);
        if (chk && chk.checked) {
          appData.words.unshift({
            id: 'w_' + Date.now() + '_' + idx,
            notebookId: targetNbId,
            ...item,
            nextReviewDate: today, interval: 1, repetitions: 0, status: 'ready'
          });
          count++;
        }
      });
      saveLocalStorage();
      alert(`已成功匯入 ${count} 個單字！`);
      document.getElementById('batch-results-wrapper')?.classList.add('hidden');
      document.getElementById('batch-text-input').value = '';
      switchTab('notebooks');
    }

    function startReview() {
      const today = new Date().toISOString().slice(0, 10);
      reviewQueue = appData.words.filter(w => w.notebookId === appData.activeNotebookId && (!w.nextReviewDate || w.nextReviewDate <= today));
      if (reviewQueue.length === 0) { alert('目前沒有今天到期需要複習的卡片！'); return; }
      reviewIndex = 0;
      document.getElementById('modal-review')?.classList.remove('hidden');
      renderReviewCard();
    }

    function closeReviewModal() { document.getElementById('modal-review')?.classList.add('hidden'); }

    function renderReviewCard() {
      if (reviewIndex >= reviewQueue.length) {
        alert('🎉 今日卡片複習完畢！');
        closeReviewModal();
        renderWords();
        return;
      }

      const card = reviewQueue[reviewIndex];
      document.getElementById('review-card-inner')?.classList.remove('card-flipped');
      document.getElementById('srs-buttons')?.classList.add('hidden');

      document.getElementById('review-progress').innerText = `卡片 ${reviewIndex + 1} / ${reviewQueue.length}`;
      document.getElementById('review-word').innerText = card.word || '';
      document.getElementById('review-synonyms').innerText = card.synonyms ? `同義: ${card.synonyms}` : '無同義詞';
      document.getElementById('review-word-back').innerText = card.word || '';
      document.getElementById('review-meaning').innerText = `${card.type || ''} ${card.meaning || ''}`;
      document.getElementById('review-phrases').innerText = card.phrases || '無';
      document.getElementById('review-sentence').innerText = `"${card.sentence || ''}"`;
      document.getElementById('review-translation').innerText = card.translation || '';
    }

    function flipCard() {
      const inner = document.getElementById('review-card-inner');
      inner.classList.toggle('card-flipped');
      if (inner.classList.contains('card-flipped')) {
        document.getElementById('srs-buttons')?.classList.remove('hidden');
      }
    }

    function handleSRS(rating) {
      const card = reviewQueue[reviewIndex];
      const wordObj = appData.words.find(w => w.id === card.id);
      
      if (wordObj) {
        let currentInterval = wordObj.interval || 1;
        let nextInterval = 1;

        if (rating === 'again') { nextInterval = 1; wordObj.repetitions = 0; }
        else if (rating === 'good') { nextInterval = Math.max(2, Math.round(currentInterval * 1.8)); wordObj.repetitions = (wordObj.repetitions || 0) + 1; }
        else if (rating === 'easy') { nextInterval = Math.max(7, Math.round(currentInterval * 2.5)); wordObj.repetitions = (wordObj.repetitions || 0) + 1; }

        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + nextInterval);
        wordObj.nextReviewDate = nextDate.toISOString().slice(0, 10);
        wordObj.interval = nextInterval;
        saveLocalStorage();
      }

      reviewIndex++;
      renderReviewCard();
    }

    function speakText(text) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function openSettingsModal() { document.getElementById('modal-settings')?.classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('modal-settings')?.classList.add('hidden'); }

    function saveSettings() {
      appData.apiKey = document.getElementById('setting-api-key').value.trim();
      appData.githubToken = document.getElementById('setting-github-token').value.trim();
      saveLocalStorage();
      closeSettingsModal();
      alert('設定已儲存！');
      if (appData.githubToken) syncFromGist();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VocabMaster_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.notebooks && imported.words) {
            appData = imported;
            saveLocalStorage();
            renderNotebookTabs();
            renderWords();
            alert('資料匯入成功！');
            closeSettingsModal();
          } else { throw new Error('格式不符'); }
        } catch (err) { alert('匯入失敗：檔案格式不正確'); }
      };
      reader.readAsText(file);
    }
  </script>
